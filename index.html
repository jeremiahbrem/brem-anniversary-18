<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy 18th Anniversary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #faf7f5;
      color: #3c2a2a;
      font-family: 'Cormorant Garamond', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    /* Outer Container using the uploaded image as the background frame */
    .card-frame {
      position: relative;
      width: 100%;
      max-width: 500px;
      min-height: 85vh;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(60, 42, 42, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 40px;
      overflow: hidden;
      background-color: #faf7f5;
    }

    /* Background image layer for fade-in effect */
    .card-frame::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('1786894503321.png');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 16px;
      opacity: 0;
      animation: fadeInBg 3s ease-in-out forwards;
      z-index: 1;
    }

    @keyframes fadeInBg {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Typing Text Styling */
    .text-container {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 225px;
    }

    .typed-text {
      font-size: 1.45rem;
      line-height: 1.7;
      letter-spacing: 0.01em;
      font-weight: 500;
      white-space: pre-wrap; /* Preserves line breaks */
      color: #3c2a2a;
    }

    @media (max-width: 480px) {
      .typed-text {
        font-size: 1.25rem;
        line-height: 1.6;
      }
      .card-frame {
        padding: 50px 28px;
        min-height: 80vh;
      }
    }
  </style>
</head>
<body>

  <div class="card-frame">
    <!-- Content Area -->
    <div class="text-container">
      <span id="typed" class="typed-text"></span>
    </div>
  </div>

  <script>
    const message = `My beautiful wife,\n\nHappy 18th Anniversary. You have held me together and I do not know what I would do without you. I love you so much and thank you for your love.\n\n- Jeremiah`;

    const typedElement = document.getElementById("typed");
    let index = 0;

    function typeChar() {
      if (index < message.length) {
        typedElement.textContent += message.charAt(index);
        index++;
        let delay = message.charAt(index - 1) === '.' || message.charAt(index - 1) === ',' ? 350 : 45;
        setTimeout(typeChar, delay);
      }
    }

    // 5-second delay before typing begins
    setTimeout(typeChar, 5000);
  </script>
</body>
</html>
